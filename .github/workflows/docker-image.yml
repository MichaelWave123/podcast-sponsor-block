name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile -t michaelwave123/pod-sponsor-block:latest
    - name: push image to dockerhub
      run: | 
        docker login -u michaelwave123 -p ${{ secrets.docker_hub_token}}
        docker push michaelwave123/pod-sponsor-block:latest
